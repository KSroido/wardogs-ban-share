name: 申请 API key
description: 申请一枚 wdb_ 开头的成员服密钥，用于提交和拉取联合 ban 记录
title: "[申请 key] "
body:
  - type: markdown
    attributes:
      value: |
        **这个 Issue 是公开的，不要在这里粘贴任何 key、token 或密码。**
        审核通过后，密钥会通过你填的联系方式私密发给你，仓库和 Issue 里永远不会有它。

        拿到 key 之后怎么存、怎么首次同步，见 [接入指南](https://github.com/KSroido/wardogs-ban-share/blob/main/docs/ONBOARDING.md)。维护者会定期看申请列表，合规的服会在这里回复。

  - type: input
    id: server_name
    attributes:
      label: 服务器简短名称（品牌名）
      description: 会显示在每条 ban 记录和 /v1/servers 列表里，2–64 个字符
      placeholder: Wardogs 社区服
    validations:
      required: true

  - type: input
    id: owner_steamid
    attributes:
      label: 管理方 SteamID64
      description: >-
        17 位 SteamID64（7656119 开头），填真正运营这组服的人。
        同一个管理方在同一地理位置的多台服共用一个 key；这个值会写进服务器的 owner 字段，所以别填别人的号。
      placeholder: "76561198000000000"
    validations:
      required: true

  - type: input
    id: server_id
    attributes:
      label: 服务器 ID（slug）
      description: 2–24 位小写字母、数字、短横线，就是 API 里的 server_id；创建后不能改
      placeholder: wardogs-main
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: 服务器地理位置
      description: >-
        服务器实际所在地，2–32 位小写，例如 cn / eu-frankfurt / us-west。
        别的服拉取时会看到这个位置，用来判断记录来自本地区还是「外籍服」（foreignofserverlocation）。
        位置不同就要单独申请一枚 key。
      placeholder: cn
    validations:
      required: true

  - type: textarea
    id: note
    attributes:
      label: 服务器备注
      description: 选填但建议写。会当作 /v1/servers 的 note 字段公开，可以写玩法、开服时间、QQ 群号、Discord 邀请链接这些宣传信息，最多 500 字
      placeholder: |
        玩法：...
        开服时间：...
        QQ 群：...
      render: text
    validations:
      required: false

  - type: input
    id: contact
    attributes:
      label: 联系方式（用于私密发放密钥）
      description: 审核结果和 wdb_ 密钥会从这个渠道发给你。QQ / Discord / 邮箱都行，但要是能私聊到你本人的，不要填公开的群
      placeholder: "QQ: 12345678 / Discord: name#0000 / mail@example.com"
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: 请确认
      options:
        - label: 服务器真实存在，我在运营它，且有权代表它申请
          required: true
        - label: 我会把 key 放进环境变量或 secret 管理器，不提交到仓库、不发群、不写死在客户端代码里
          required: true
        - label: 我理解误封由本服负责撤销，联盟不替成员服裁决申诉
          required: true
